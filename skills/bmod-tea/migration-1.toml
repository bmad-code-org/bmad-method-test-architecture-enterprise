# TEA's first migration, v6 to v7. `bmad migrate` runs a module's `migration-<n>.toml` files in `<n>` order.

[migration]
module = "tea"
from = "6"
to = "7"
title = "Move v6 TEA settings to the v7 module config and skill customizations"
summary = "Keeps the answers the classic installer recorded, moves the two settings that only one skill reads into that skill's customization file, drops the settings no skill reads any more, and offers to remove the classic installer's leftovers under _bmad/tea/."

# Read-only signals. Any one of them makes this migration worth offering.
detect = """
- `_bmad/tea/config.yaml` exists (the classic installer's TEA config).
- `_bmad/tea/module-help.csv` exists.
- `[modules.tea]` in `_bmad/config.toml` holds `ci_platform`, `tea_evaluations_folder`, `risk_threshold`, `test_design_output`, `test_review_output` or `trace_output`. The classic installer in bmad-method 6.12 already writes this table, so a project can have a `[modules.tea]` and still be on v6.
A project whose `[modules.tea]` holds only the nine keys `bmad setup tea` asks and that has no `_bmad/tea/config.yaml` is on v7; say so and stop.
"""

# The state every rule below moves toward.
target = """
- `_bmad/config.toml` `[modules.tea]` holds exactly these keys: `test_artifacts`, `tea_use_playwright_utils`, `tea_use_pactjs_utils`, `tea_pact_mcp`, `tea_browser_automation`, `tea_execution_mode`, `tea_capability_probe`, `test_stack_type`, `test_framework`. Every value is a string; v6 booleans (`true`, `false`) become `"true"` and `"false"`.
- A v6 `ci_platform` other than `auto` lives in `_bmad/custom/bmad-testarch-ci.toml` as `ci_platform = "<value>"` under `[workflow]`.
- A v6 `tea_evaluations_folder` other than `evals` lives in `_bmad/custom/bmad-testarch-evaluate.toml` as `evaluations_folder = "<folder>"` under `[workflow]`, relative to the project root.
- `risk_threshold`, `test_design_output`, `test_review_output` and `trace_output` are gone; no skill reads them.
- `_bmad/tea/config.yaml`, `_bmad/tea/module-help.csv` and any classic-installer copies of TEA's agents or workflows under `_bmad/tea/` are removed, so the CLI and the skills read only the v7 install.
"""

precautions = """
- Read before writing. Show the user the plan (each key and where it goes) and wait for approval.
- Edit only `_bmad/config.toml`, `_bmad/custom/bmad-testarch-ci.toml` and `_bmad/custom/bmad-testarch-evaluate.toml`. Keep every other table and comment in those files as it is, and merge into a customization file that already exists instead of replacing it.
- Never delete a file outside version control. Removing the leftovers is a commit the user chooses; offer it and stop there.
- Never run `bmad setup` over a project this migration has not finished; it owns the rest of `_bmad/`.
"""

guide = """
1. **Inventory.** Read `_bmad/config.toml` `[modules.tea]`, `_bmad/tea/config.yaml` and `_bmad/custom/bmad-testarch-ci.toml` and `_bmad/custom/bmad-testarch-evaluate.toml` when they exist. List every TEA key with its value and the file it came from. When both `[modules.tea]` and `config.yaml` hold a key, `[modules.tea]` is the one the skills read; report a difference between them.
2. **Plan.** Build the table below for the user: one row per key found, naming its destination.

   | v6 key | v7 destination |
   |---|---|
   | `test_artifacts`, `tea_use_playwright_utils`, `tea_use_pactjs_utils`, `tea_pact_mcp`, `tea_browser_automation`, `tea_execution_mode`, `tea_capability_probe`, `test_stack_type`, `test_framework` | stays in `[modules.tea]`, written as strings |
   | `ci_platform` | `_bmad/custom/bmad-testarch-ci.toml`, `[workflow]` `ci_platform`, only when it is not `auto` |
   | `tea_evaluations_folder` | `_bmad/custom/bmad-testarch-evaluate.toml`, `[workflow]` `evaluations_folder`, only when it is not `evals`; v6 stored `{project-root}/<folder>`, so write `<folder>` |
   | `risk_threshold`, `test_design_output`, `test_review_output`, `trace_output` | dropped |
   | any other key | ask the user; it is not a TEA setting v7 reads |

   Also list the classic-installer leftovers found under `_bmad/tea/` (`config.yaml`, `module-help.csv`, and any `agents/` or `workflows/` folder) as removal candidates.
3. **Only a `config.yaml` exists** (no `[modules.tea]` in `_bmad/config.toml`). Ask `bmad setup tea` to record the nine questions with the YAML values as the answers, then continue with step 4 for the two moved keys.
4. **Apply the approved plan.** Rewrite the `[modules.tea]` values that are not strings, remove the keys the plan moves or drops, and write the two customization files. Create `_bmad/custom/` entries only for values that differ from the defaults named above.
5. **Leftovers.** Offer to remove the candidates from step 2 as one commit. A `config.yaml` left beside `_bmad/config.toml` is ignored by the skills and read only by `tea-test-review` when `_bmad/config.toml` does not exist, so it is safe to keep but misleading; say so.
6. **Report.** Give the user the final `[modules.tea]` table, the two customization files that were written, and the leftovers that remain.
"""

checklist = [
  "`_bmad/config.toml` `[modules.tea]` holds exactly the nine v7 keys, each value a string.",
  "A non-default v6 `ci_platform` is `ci_platform` under `[workflow]` in `_bmad/custom/bmad-testarch-ci.toml`.",
  "A non-default v6 `tea_evaluations_folder` is `evaluations_folder` under `[workflow]` in `_bmad/custom/bmad-testarch-evaluate.toml`, without the `{project-root}/` prefix.",
  "`risk_threshold`, `test_design_output`, `test_review_output` and `trace_output` are no longer in `[modules.tea]`.",
  "`uv run _bmad/scripts/resolve_config.py --project-root . --key modules.tea` prints the nine keys and nothing else.",
  "`uv run _bmad/scripts/resolve_customization.py --skill <skill-root> --project-root . --key workflow` for `bmad-testarch-ci` and `bmad-testarch-evaluate` prints the migrated values.",
  "Every file the plan listed for removal is either removed in the commit the user chose or reported as still present.",
]
