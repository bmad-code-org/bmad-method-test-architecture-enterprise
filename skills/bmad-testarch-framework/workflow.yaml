# Test Architect workflow: bmad-testarch-framework
name: bmad-testarch-framework
# prettier-ignore
description: 'Initialize test framework and CI/CD setup for browser, backend or mobile stacks. Use when the user says "lets setup test framework" or "I want to initialize testing framework"'

# Config (test_artifacts, user_name, languages) is resolved at activation in SKILL.md from modules.tea and core.
date: system-generated

# Workflow components
installed_path: "."
instructions: "./instructions.md"
validation: "./checklist.md"

# Variables and inputs
variables:
  test_dir: "{project-root}/tests" # Root test directory
  use_typescript: true # Prefer TypeScript configuration
  framework_preference: "auto" # auto, playwright, cypress - user can override auto-detection
  project_size: "auto" # auto, small, large - influences framework recommendation
  setup_scope: "auto" # framework, ci, both; resolved from the request
  test_stack_type: "auto" # frontend, backend, fullstack, mobile
  test_framework: "auto" # resolved jointly for scaffold and pipeline

# Output configuration
default_output_file: "{test_dir}/README.md" # Main deliverable is test setup README

# Required tools
required_tools:
  - read_file # Read package.json, existing configs
  - write_file # Create config files, helpers, fixtures, tests
  - create_directory # Create test directory structure
  - list_files # Check for existing framework
  - search_repo # Find architecture docs

tags:
  - qa
  - setup
  - test-architect
  - framework
  - initialization
  - ci-cd
  - pipeline

execution_hints:
  interactive: false # Minimize prompts; auto-detect when possible
  autonomous: true # Proceed without user input unless blocked
  iterative: true
