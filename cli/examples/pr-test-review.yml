# tea-test-review: a starting template for a required test-review gate.
#
# One job. `tea-test-review --github` opens a check run before the review,
# closes it with the verdict, and keeps one pull-request comment up to date. The
# job's exit code is the verdict, so making this job a required status check
# gates merges on it.
#
# The comment is short: the gate verdict, the reviewed head SHA, and up to three
# findings that affect the gate. The full report and the verdict JSON are
# uploaded as a workflow artifact by the last step; the comment names that
# artifact as available once the upload step has finished.
#
# Prerequisites:
#   - An ANTHROPIC_API_KEY repository secret (this template runs --agent claude,
#     executed by the claude CLI installed below). --agent codex is also
#     supported (OPENAI_API_KEY instead; see the --agent flag in the TEA
#     documentation's tea-test-review CLI reference
#     (https://bmad-code-org.github.io/bmad-method-test-architecture-enterprise/reference/tea-test-review-cli/)
#     and swap the installed package and secret accordingly.
#   - A vetted version of the bmad-method-test-architecture-enterprise npm
#     package, pinned exactly (see TEA_VERSION below).
#
# Honest limitations, read before requiring this check:
#   - This workflow cannot be the sole required check for repositories that
#     accept fork pull requests: forks receive no secrets by design, so the
#     fork guard below skips the review for them and the gate never runs.
#     Fork coverage needs a separate privileged design (for example a
#     pull_request_target workflow with strict controls), which is out of
#     scope for this template.
#   - The review skill ships inside the pinned package, outside the checkout, so
#     a pull request cannot edit the reviewer that judges it. The residual trust
#     assumption: you are trusting the pinned version as published on the npm
#     registry. Vet that version once, pin it exactly, and bump the pin
#     deliberately.
#
# Gate-policy flags (all optional; tune to your gate policy):
#   --min-score <n>            fail below a quality-score floor (0-100)
#   --max-critical <n>         fail above a Critical-violation cap (default: no cap)
#   --min-files <n>            fail when fewer than n files were reviewed (default 1)
#   --waive/--waive-until      record a time-boxed waiver: any verdict failure exits 0 with a WAIVED
#                              banner and waived fields in the JSON (exit 2/3 are never waivable)
name: TEA Test Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Default deny; the job grants exactly the permissions it needs.
permissions: {}

jobs:
  review:
    name: Headless test review
    runs-on: ubuntu-latest
    # Forks receive no secrets, so the review cannot run for them; skip
    # honestly instead of failing (see the header comment).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      # Pin both, so the reviewer's control plane is the exact code you vetted
      # and not whatever `latest` resolves to when a pull request lands. 1.28.0
      # is the first release that ships --github and the packaged skill: use
      # the exact version you vetted.
      TEA_VERSION: 1.28.0
      CLAUDE_CODE_VERSION: 2.1.220
    steps:
      - name: Checkout (full history for the PR diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The review only reads the tree; never hand the PR checkout a
          # credentials-bearing git config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the pinned CLI and agent
        run: npm install --global "bmad-method-test-architecture-enterprise@${TEA_VERSION}" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run headless test review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The default token: the Checks API rejects a classic personal access
          # token, and this one needs only the job permissions above.
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # No ${{ }} expansion inside run text: values arrive through the
        # environment so a crafted branch name cannot inject shell.
        #
        # --pr takes the base branch from GITHUB_BASE_REF, which a pull_request
        # run sets, so no API lookup is needed. The skill comes from the
        # installed package, so no skill path is needed.
        #
        # TEA config: unless the repository commits _bmad/config.toml, the
        # module defaults apply (Playwright Utils on, Pact.js Utils on, Pact MCP
        # on). Those values are stated in the prompt, so the run is
        # deterministic either way. Override them with flags, for example:
        #   --no-use-pactjs-utils --pact-mcp none
        # A committed [modules.tea] table in _bmad/config.toml works too; the
        # flags win over it.
        run: tea-test-review --github --pr "$PR_NUMBER" --agent claude --artifact-name tea-test-review --output test-review.md --json test-review.json

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tea-test-review
          path: |
            test-review.md
            test-review.json
