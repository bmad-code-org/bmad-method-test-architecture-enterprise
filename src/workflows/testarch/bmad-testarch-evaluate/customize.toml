# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-testarch-evaluate. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (target conventions, evaluation policy, prior findings). Distinct
# from a run's own evidence -- these are static context loaded on
# activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Every probe corpus needs one clean control."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/eval-standards.md"
#     (glob patterns are supported; matching files load in lexical path order as facts).

persistent_facts = []

# Scalar: executed when the workflow reaches its terminal stage,
# after the final outputs are produced. Override wins. Leave empty
# for no custom post-completion behavior.

on_complete = ""
