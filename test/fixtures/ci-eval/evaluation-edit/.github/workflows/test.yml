# Pipeline for ember-ledger.
# The test job is maintained by the platform team. Do not regenerate it.

name: Test Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Maintained by the platform team
    name: 'Unit tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      # The platform team pins Node through .nvmrc on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run unit tests'
        run: npm test

  evaluation-evals-ledger-pr:
    # tea-evaluation-plan: evals/ledger/ci/evaluation-ci-plan.json
    name: "Evaluation (pr)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install evaluation tooling
        run: |
          npm install --prefix 'evals'

      - name: "check, compile"
        run: |
          npm exec --prefix 'evals' -- tea-evaluate ci --evaluation 'evals/ledger' --tier pr

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-runs
          path: evals/ledger/runs/
          if-no-files-found: warn
          retention-days: 30
