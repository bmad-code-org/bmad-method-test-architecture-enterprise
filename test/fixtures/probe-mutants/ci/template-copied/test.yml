# GitHub Actions CI pipeline for lantern-audit-log
# Generated by BMad TEA Agent, adapted from github-actions-template.yaml
# Stack: backend | Framework: node:test

name: Test Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run burn-in loop (10 iterations)
        run: |
          for i in $(seq 1 10); do
            echo "Burn-in iteration $i/10"
            npm test || exit 1
          done
