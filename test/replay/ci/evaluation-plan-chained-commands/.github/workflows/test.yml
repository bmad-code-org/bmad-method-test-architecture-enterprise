# GitHub Actions pipeline for quarry-grader
# Generated by BMad TEA Agent - Test Architect Module
# Stack: backend (Node.js) | Framework: node:test (npm test)
#
# Scope is fixed by docs/ci-requirements.md: the test job and the evaluation
# checks, on pull requests to main. No lint, sharding, burn-in, retries or
# extra artifacts.

name: Test Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  evaluation-pr:
    # tea-evaluation-plan: evals/grader/ci/evaluation-ci-plan.json
    name: "Evaluation (pr)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}


      - name: "check, compile, seal, oracle-agreement, replay"
        run: |
          npm install --prefix 'evals' && npm exec --prefix 'evals' -- tea-evaluate ci --evaluation 'evals/grader' --tier pr

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-pr-runs
          path: evals/grader/runs/
          if-no-files-found: warn
          retention-days: 30
