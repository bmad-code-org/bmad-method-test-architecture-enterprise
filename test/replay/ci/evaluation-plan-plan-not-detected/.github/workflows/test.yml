# GitHub Actions pipeline for quarry-grader
# Generated by BMad TEA Agent - Test Architect Module
# Stack: backend (Node.js) | Framework: node:test via `npm test`
# Scope is fixed by docs/ci-requirements.md: the test job and the evaluation checks.

name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
