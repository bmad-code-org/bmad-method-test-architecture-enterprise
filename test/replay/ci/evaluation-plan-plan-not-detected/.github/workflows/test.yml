# GitHub Actions pipeline for quarry-grader
# Generated by BMad TEA Agent - Test Architect Module
# Stack: backend (Node.js) | Framework: node:test (npm test)
#
# Scope is fixed by docs/ci-requirements.md: the test job and the evaluation
# checks, on pull requests to main. No lint, sharding, burn-in, retries or
# extra artifacts.

name: Test Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
