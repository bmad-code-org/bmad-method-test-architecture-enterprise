# GitHub Actions CI pipeline for granite-router
# Generated by BMad TEA Agent - Test Architect Module
# Stack: backend (Node.js) | Framework: node:test (npm test)

name: Test Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Weekly on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  evaluation-pr:
    # tea-evaluation-plan: evals/router/ci/evaluation-ci-plan.json
    name: "Evaluation (pr)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}

      - name: Install evaluation tooling
        run: |
          npm install --prefix evals

      - name: "check, compile, seal, replay"
        run: |
          npm exec --prefix evals -- tea-evaluate ci --evaluation evals/router --tier pr

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-pr-runs
          path: evals/router/runs/
          if-no-files-found: warn
          retention-days: 30

  evaluation-merge:
    # tea-evaluation-plan: evals/router/ci/evaluation-ci-plan.json
    name: "Evaluation (merge)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}

      - name: Install evaluation tooling
        run: |
          npm install --prefix evals

      - name: "check, compile, seal, replay"
        run: |
          npm exec --prefix evals -- tea-evaluate ci --evaluation evals/router --tier pr

      - name: "preflight-live"
        run: |
          npm exec --prefix evals -- tea-evaluate ci --evaluation evals/router --tier merge

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-merge-runs
          path: evals/router/runs/
          if-no-files-found: warn
          retention-days: 30

  evaluation-scheduled:
    # tea-evaluation-plan: evals/router/ci/evaluation-ci-plan.json
    name: "Evaluation (scheduled)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}

      - name: Install evaluation tooling
        run: |
          npm install --prefix evals

      - name: "twin-run, held-out"
        run: |
          npm exec --prefix evals -- tea-evaluate ci --evaluation evals/router --tier scheduled

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-scheduled-runs
          path: evals/router/runs/
          if-no-files-found: warn
          retention-days: 30

  evaluation-release:
    # tea-evaluation-plan: evals/router/ci/evaluation-ci-plan.json
    name: "Evaluation (release)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}

      - name: Install evaluation tooling
        run: |
          npm install --prefix evals

      - name: "preflight-live, held-out"
        run: |
          npm exec --prefix evals -- tea-evaluate ci --evaluation evals/router --tier release

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-release-runs
          path: evals/router/runs/
          if-no-files-found: warn
          retention-days: 30
