# Pipeline for ember-ledger.
# The test job is maintained by the platform team. Do not regenerate it.

name: Test Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Maintained by the platform team
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      # The platform team pins Node through .nvmrc on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run unit tests'
        run: npm test

  evaluation-pr:
    # tea-evaluation-plan: evals/ledger/ci/evaluation-ci-plan.json
    name: "Evaluation (pr)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Determine Node version
        id: node-version
        run: |
          floor=22.20.0
          value=24
          if [ -f .nvmrc ]; then
            pinned="$(tr -d 'v \r\n' < .nvmrc)"
            if printf '%s' "$pinned" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' && [ "$(printf '%s\n' "$floor" "$pinned" | sort -V | head -n 1)" = "$floor" ]; then value="$pinned"; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}

      - name: Install evaluation tooling
        run: |
          npm install --prefix 'evals'

      - name: "check, compile, seal, replay"
        run: |
          npm exec --prefix 'evals' -- tea-evaluate ci --evaluation 'evals/ledger' --tier pr

      - name: Upload evaluation runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-pr-runs
          path: evals/ledger/runs/
          if-no-files-found: warn
          retention-days: 30
