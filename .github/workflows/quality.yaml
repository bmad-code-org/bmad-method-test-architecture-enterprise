name: Quality & Validation

# Runs comprehensive quality checks on all PRs:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - Schema validation (YAML structure)
# - Agent schema tests (fixture-based validation)
# - Installation component tests (compilation)
#
# The `validate` job must stay a superset of `npm test`'s non-lint half. Three
# suites used to run ONLY from .husky/pre-commit — test:knowledge, test:changelog,
# and test:tea-workflow-descriptions — and `git commit --no-verify` skips that
# hook, as does every edit made through the GitHub web UI. test:knowledge is the
# one carrying the knowledge-copy parity check across the eight bmad-testarch workflows, so for as long as it was
# absent here nothing in CI stopped the workflow copies of the knowledge base from
# silently diverging from the agent's.
#
# test:cli is the deliberate exception in the other direction: it runs here and
# NOT in `npm test`, because a full unsharded run takes 12-15 minutes and
# `npm test` runs on every commit through the pre-commit hook. The `cli` job
# below shards that one file three ways (see its own comment) so CI's wall
# time is the slowest shard, not the sum of all three.
#
# test:lockfile-age, test:lockfile-age-cache, test:licences and
# test:supply-chain are the same kind of exception: they run in `npm test` and
# in their own `supply-chain` job below, not inside `validate`, so a registry
# outage names itself here rather than reading as an unrelated check failing.
# lockfile-age reads a committed publication cache (`.lockfile-age-cache.json`)
# with no request for a cached name@version and fetches only what is missing,
# which is what makes running it in `npm test` on every local commit
# reasonable rather than a network dependency the pre-commit hook cannot
# avoid. lockfile-age-cache makes exactly one such request, against a fixed,
# already-published package, and skips rather than fails when it cannot reach
# the registry at all.
#
# The `validate` job installs `bubblewrap` before it reaches the atdd isolation
# proof, because that suite runs generated test code and refuses to run
# unconfined: `bubblewrap` is its linux backend, not preinstalled on this
# runner image, and a failed install here has to read as "the dependency did
# not install" rather than surface three steps later as an opaque isolation
# failure.
#
# test:direction, test:boundary, test:lineage, test:guard-publish and
# test:layering-boundary-lineage are the same kind of exception as
# test:licences and test:supply-chain: they run in `npm test` and in their own
# `layering-boundary-lineage` job below, not inside `validate`.

"on":
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run docs:validate-links

      - name: Build documentation
        run: npm run docs:build

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The actionlint version this installs floats to latest rather than pinned:
      # test/eval-ci.js's own pre-flight enforces the minimum version its flags
      # were written against, so a newer release only ever adds coverage. The
      # installer script itself is pinned by commit and checksummed before it
      # runs, because "main" is mutable and a script that ends in `sudo mv` is
      # not something to pipe from a branch nobody reviews on every run.
      - name: Install actionlint
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash
          echo "a96d60132afb74536ff2b55cc784d5c55b0b57980d3d49f962f0b3871447d53a  download-actionlint.bash" | sha256sum -c -
          bash download-actionlint.bash
          sudo mv ./actionlint /usr/local/bin/

      - name: Check for unresolved conflict markers
        run: npm run test:conflict-markers

      - name: Validate YAML schemas
        run: npm run validate:schemas

      - name: Run agent schema validation tests
        run: npm run test:schemas

      - name: Check that every npm test step runs in CI
        run: npm run test:ci-coverage

      - name: Prove the script-coverage gate's own filter logic against synthetic input
        run: npm run test:ci-coverage-filters

      - name: Prove _bmad-output/ is gated by lint, markdownlint and prettier while _bmad/ is not
        run: npm run test:bmad-output-gated

      - name: Validate release metadata
        run: npm run test:release-metadata

      - name: Test agent compilation components
        run: npm run test:install

      - name: Test knowledge base (index sync, link resolution, workflow-copy parity)
        run: npm run test:knowledge

      - name: Validate criteria-registry to fragment traceability
        run: npm run test:criteria-fragments

      - name: Test the doc-counts gate's own source module
        run: npm run test:doc-count-sources

      - name: Hold published documentation counts against their source
        run: npm run test:doc-counts

      - name: Test the doc-claims gate's own source module
        run: npm run test:doc-claim-sources

      - name: Hold published prose claims against their artifact
        run: npm run test:doc-claims

      - name: Test write-time enforcement hook
        run: npm run test:enforce-hook

      - name: Score the bmad-testarch-framework scaffold's contents
        run: npm run test:framework-scaffold

      - name: Install bubblewrap (tea-atdd-red-check's linux isolation backend)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # Ubuntu 24.04+ ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks bwrap's --unshare-net from bringing up its own loopback interface
      # (RTM_NEWADDR) inside an unprivileged user namespace unless the bwrap
      # binary carries an AppArmor profile explicitly granting `userns` — one
      # this runner image's bubblewrap package does not ship. Disabling the
      # restriction on this disposable, single-job runner is what every other
      # project hitting this exact failure on ubuntu-latest (Codex, Claude
      # Code's own sandboxed Bash tool, VS Code) does; it governs whether bwrap
      # can create the namespace at all, not what cli/lib/atdd-isolation.js does
      # once the namespace exists, which is everything this suite actually
      # tests.
      - name: Allow bubblewrap to create its own network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prove tea-atdd-red-check's isolation backend confines a hostile spec
        run: npm run test:atdd-isolation

      - name: Prove the in-process net guard refuses what the OS backend cannot
        run: npm run test:atdd-net-guard

      - name: Prove atdd scoring requires assertion provenance, not just message text
        run: npm run test:atdd-scoring

      # Two of the eight documented commands this gate re-runs (test:eval-schemas,
      # test:probe-targets) exercise the atdd preflight path, which needs the
      # linux isolation backend installed above — running this any earlier fails
      # on a fresh runner with no bubblewrap yet, for a reason that has nothing
      # to do with whether the documented command itself is correct.
      - name: Test the doc-invocations gate's own entry script
        run: npm run test:doc-invocation-entry

      - name: Run documented commands against the real repository
        run: npm run test:doc-invocations

      - name: Prove the multi-turn transcript engine drives a session and catches a contradiction
        run: npm run test:transcript-harness

      - name: Validate fragment-selection eval data
        run: npm run test:eval-data

      - name: Validate ATDD eval corpus
        run: npm run test:eval-atdd-data

      - name: Validate NFR eval corpus
        run: npm run test:eval-nfr-data

      - name: Validate NFR corpus validation checks fire on a seeded defect
        run: npm run test:nfr-validate-corpus

      - name: Validate CI eval corpus
        run: npm run test:eval-ci-data

      - name: Validate test-design eval corpus
        run: npm run test:eval-test-design-data

      - name: Validate trace eval corpus
        run: npm run test:eval-trace-data

      - name: Validate the bmad-tea routing eval corpus
        run: npm run test:eval-routing-data

      - name: Validate transcript eval corpus
        run: npm run test:eval-transcript-data

      - name: Validate the eval suite manifest and result schema
        run: npm run test:eval-schemas

      - name: Replay stored eval outputs against the scorers
        run: npm run test:eval-replay

      - name: Compile eval-quality's own published corpus against the pinned release
        run: npm run test:eval-quality-corpus

      - name: Hold every schemaVersion TEA writes to the constant the installed eval-quality exports
        run: npm run test:schema-versions

      - name: Check the eval contracts against the sources they are generated from
        run: npm run test:contract-sources

      - name: Compile the eval contracts
        run: npm run test:contracts

      - name: Evaluate every contract oracle against the stored outputs and the harness scorers
        run: npm run test:contract-oracles

      - name: Check the probe corpora against the sources they are generated from
        run: npm run test:probe-sources

      - name: Score every probe corpus through eval-quality against stored evidence
        run: npm run test:probe-corpus

      - name: Prove compareDominance reaches every relation it declares and refuses a comparabilityKey mismatch
        run: npm run test:compare-dominance

      - name: Prove the automate-eval fixture's seeded regression rolls back live
        run: npm run test:automate-eval-fixture

      - name: Prove bmad-testarch-automate's stand-in coverage catches the qualified regression
        run: npm run test:eval-automate-data

      - name: Prove the clock port is in the path that produces a duration
        run: npm run test:clock-port

      - name: Run the published port conformance suite against the command-line adapter
        run: npm run test:probe-conformance

      - name: Run the published corpus port conformance suite against the shipped adapter
        run: npm run test:corpus-conformance

      - name: Run the published port conformance suite against the file-system adapter
        run: npm run test:file-system-conformance

      - name: Prove the trace harness reads and writes through the file-system port
        run: npm run test:file-system-port

      - name: Probe every TEA command target through the eval-quality adapter
        run: npm run test:probe-targets

      - name: Check TEA's branches are total over the published port vocabularies
        run: npm run test:port-totality

      - name: Test changelog stamping
        run: npm run test:changelog

      - name: Validate TEA workflow descriptions
        run: npm run test:tea-workflow-descriptions

  # Split out of `validate` on its own: it takes ~12-15 minutes, and leaving it
  # in line meant every fast check behind it reported that late.
  #
  # test/test-test-review-cli.js is itself further split across this matrix by
  # its 13 numbered suites (TEA_CLI_TEST_SUITES), so the three shards run in
  # parallel instead of one job serializing all thirteen. Suite 7 (CLI
  # end-to-end) alone accounts for ~59 of the file's ~90 child-process spawns
  # (measured on 2026-09-08), so it runs alone rather than beside the other
  # spawn-heavy suites; "unit" bundles every suite that spawns no subprocess at
  # all plus the two that spawn only a handful. TEA_CLI_TEST_SUITES unset (any
  # local run, and the pre-commit hook) still runs all thirteen, unchanged.
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            suites: "1,2,3,4,5,6,10,11,12,13"
          - name: e2e
            suites: "7"
          - name: git
            suites: "8,9"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job only reads. actions/checkout persists the job token in
          # .git/config by default, where any step or test process could read it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # test:cli's eval:all reconciliation tests run --preflight-only across every
      # manifest suite, including ci, whose pre-flight is a hard actionlint
      # dependency. See the validate job's own Install actionlint step for why
      # this floats to latest rather than pinning a version, and why the
      # installer script itself is pinned by commit and checksummed.
      - name: Install actionlint
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash
          echo "a96d60132afb74536ff2b55cc784d5c55b0b57980d3d49f962f0b3871447d53a  download-actionlint.bash" | sha256sum -c -
          bash download-actionlint.bash
          sudo mv ./actionlint /usr/local/bin/

      # test:cli spawns test/eval-all.js as a real child process, and eval-all
      # preflights every suite the manifest declares, atdd included since it
      # is no longer deferred: reaching the CLI test this job actually cares
      # about requires a working isolation backend to exist first, the same
      # way the validate job's own atdd isolation proof does.
      - name: Install bubblewrap (tea-atdd-red-check's linux isolation backend)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Allow bubblewrap to create its own network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test TEA test-review CLI (${{ matrix.shard.name }})
        run: npm run test:cli
        env:
          TEA_CLI_TEST_SUITES: ${{ matrix.shard.suites }}

  # The supply-chain gates. lockfile-age asks the registry for every locked
  # entry's publication time, licences holds every locked licence expression to
  # the allowlist, and test:supply-chain seeds one violation per gate and watches
  # each fail. Their own job, so a registry outage or a young pin names itself
  # here rather than inside validate.
  supply-chain:
    runs-on: ubuntu-latest
    # lockfile-age fetches publish metadata for every locked entry from the
    # public npm registry; bound the worst case rather than letting a stalled
    # request hold the runner until GitHub's own maximum job duration.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job runs npm ci (arbitrary install scripts), fetches JSON from
          # the npm registry, and shells out to a third-party binary; the token
          # persist-credentials would otherwise leave in .git/config has no
          # business surviving a step that is defending against exactly that
          # class of compromise.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit both lockfiles for publication age
        run: npm run test:lockfile-age

      - name: Prove the lockfile-age cache generator still reads the registry correctly
        run: npm run test:lockfile-age-cache

      - name: Hold both lockfiles to the licence allowlist
        run: npm run test:licences

      - name: Seed one violation per gate and watch it fail
        run: npm run test:supply-chain

  # dependency-direction holds cli/, tools/, test/ and src/**/*.cjs to a declared
  # layer graph and stays report-only until two eval-quality limits are fixed
  # upstream. package-boundary holds the published src/, cli/ and .claude-plugin/
  # trees against dev-only path references. field-ownership holds schemaVersion
  # to the two generators that stamp it. test:guard-publish seeds a token-present,
  # workflow-absent environment and watches the publish guard refuse it.
  layering-boundary-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report import-direction violations over cli/, tools/, test/ and src/**/*.cjs
        run: npm run test:direction

      - name: Hold the published tree to the package boundary
        run: npm run test:boundary

      - name: Hold schemaVersion to its two generators
        run: npm run test:lineage

      - name: Seed a token-present, workflow-absent environment and watch the publish guard refuse it
        run: npm run test:guard-publish

      - name: Verify each gate's script name and seed one violation per failing gate
        run: npm run test:layering-boundary-lineage

  # c8-wrapping the whole npm test chain roughly doubles its wall-clock time,
  # so this runs as its own job rather than joining the pre-commit-driven
  # chain, the same tradeoff test:cli and the supply-chain gates make.
  coverage:
    runs-on: ubuntu-latest
    # The full npm test chain includes test:lockfile-age and
    # test:lockfile-age-cache, both of which hit the public npm registry;
    # bound the worst case the same way the supply-chain job does rather than
    # letting a stalled request hold the runner until GitHub's own maximum.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job runs npm ci (arbitrary install scripts) and the full npm
          # test chain, which pipes a third-party actionlint binary's output
          # into the ci eval suite; the token persist-credentials would
          # otherwise leave in .git/config has no business surviving that.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The actionlint version this installs floats to latest rather than
      # pinned, for the same reason the validate job's own Install actionlint
      # step gives: test/eval-ci.js's own pre-flight enforces the minimum
      # version its flags were written against, so a newer release only ever
      # adds coverage. The installer script itself is pinned by commit and
      # checksummed before it runs.
      - name: Install actionlint
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash
          echo "a96d60132afb74536ff2b55cc784d5c55b0b57980d3d49f962f0b3871447d53a  download-actionlint.bash" | sha256sum -c -
          bash download-actionlint.bash
          sudo mv ./actionlint /usr/local/bin/

      # This job runs the whole npm test chain, which includes
      # tea-atdd-red-check's isolation proof: the same reason the validate
      # job installs bubblewrap. Skipping this here does not skip that test,
      # it makes it fail on a missing backend instead of proving the
      # confinement, taking the whole chain down before c8 has instrumented
      # most of cli/lib and tools/ and reporting a near-zero, meaningless
      # coverage number rather than a real one. Discovered exactly this way
      # the first time this job ran in CI: a 4-second failure reading as
      # "coverage is 9.9%" when the real story was "the chain crashed before
      # c8 had anything to instrument." Any future job that runs the full
      # chain inherits whatever system dependencies the chain has
      # accumulated; keep this job's install steps in step with validate's
      # and cli's rather than rediscovering this the same way.
      - name: Install bubblewrap (tea-atdd-red-check's linux isolation backend)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Allow bubblewrap to create its own network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the npm test chain under coverage and enforce the threshold
        run: npm run test:coverage
