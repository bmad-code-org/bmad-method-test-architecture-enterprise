name: Quality & Validation

# Runs comprehensive quality checks on all PRs:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - Documentation link validation and site build
# - The whole `npm test` chain, split across the `chain` matrix
# - Coverage over that chain, merged from every shard
#
# The `chain` job runs every script in `npm test`, split five ways by
# tools/test-shards.js. The split is deterministic: tools/test-shard-weights.json
# holds each script's measured seconds under coverage, and the tool packs them
# heaviest first onto the lightest shard, so each shard carries about four
# minutes of the chain. Run serially on one runner under c8, the same chain
# took about 20 minutes. Each shard records raw V8 coverage for its scripts
# and uploads it; the `coverage` job merges every shard's files with
# `c8 report` and holds the package.json thresholds against the whole chain.
# test:ci-coverage fails when a chained script is neither in that full shard
# matrix nor named by an `npm run` step, and test:shards fails when the
# partition drops a script or the matrix skips a shard.
#
# Three suites used to run ONLY from .husky/pre-commit: test:knowledge,
# test:changelog and test:tea-workflow-descriptions. `git commit --no-verify`
# skips that hook, as does every edit made through the GitHub web UI.
# test:knowledge carries the knowledge-copy parity check across the eight
# bmad-testarch workflows, so for as long as it was absent here nothing in CI
# stopped the workflow copies of the knowledge base from silently diverging
# from the agent's. Running the chain itself in CI is what keeps any suite
# from being missed that way again.
#
# test:lockfile-age, test:lockfile-age-cache, test:licences and
# test:supply-chain run in the chain shards and again in their own
# `supply-chain` job below, so a registry outage names itself in a job of its
# own. lockfile-age reads a committed publication cache
# (`.lockfile-age-cache.json`) with no request for a cached name@version and
# fetches only what is missing, which is what makes running it in `npm test`
# on every local commit reasonable. lockfile-age-cache makes exactly one such
# request, against a fixed, already-published package, and skips when it
# cannot reach the registry at all.
#
# test:direction, test:boundary, test:lineage, test:guard-publish and
# test:layering-boundary-lineage run in the chain shards and again in their
# own `layering-boundary-lineage` job below, and format:check, lint and lint:md
# do the same with the prettier, eslint and markdownlint jobs. Those jobs
# finish in under a minute and name the failing gate in the job list; the
# shards still run every chained script, because the merged coverage has to
# come from the whole chain.

"on":
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run docs:validate-links

      - name: Build documentation
        run: npm run docs:build

  # The whole `npm test` chain, split across five runners. tools/test-shards.js
  # picks this shard's scripts from the chain and the committed weights, runs
  # them one at a time in chain order (several bind fixed ports or write fixed
  # temp paths), keeps going past a failure so one run names every failing
  # script, and exits 1 when any failed. Each script's raw V8 coverage lands in
  # $RUNNER_TEMP/v8 under a shard-and-script prefix for the coverage job.
  #
  # The shard count appears twice, in the matrix list and in the tool's
  # `--shard ${{ matrix.shard }}/5` argument; test:shards and test:ci-coverage
  # both fail when the list is not exactly 1 through that count. To change the
  # count, change both and read the balance off
  # `node tools/test-shards.js --list --shard <i>/<n>` for each shard.
  chain:
    name: chain (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    # Each shard carries about four minutes of the chain by the weights, plus
    # about a minute of setup. Three times that bounds a stalled registry
    # request or a hung child without cutting off a slow but healthy run.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job runs npm ci (arbitrary install scripts), and its chain
          # pipes a third-party actionlint binary's output into the ci eval
          # suite; the token persist-credentials would otherwise leave in
          # .git/config has no business surviving that.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The actionlint version this installs floats to latest rather than pinned:
      # test/eval-ci.js's own pre-flight enforces the minimum version its flags
      # were written against, so a newer release only ever adds coverage. The
      # installer script itself is pinned by commit and checksummed before it
      # runs, because "main" is mutable and a script that ends in `sudo mv` is
      # not something to pipe from a branch nobody reviews on every run.
      #
      # Every shard installs actionlint and bubblewrap, whichever scripts the
      # weights put on it. test:eval-ci-data, test:eval-replay,
      # test:probe-targets, test:doc-invocations and test:cli need actionlint;
      # the atdd isolation proofs, test:framework-scaffold-install-isolation,
      # test:transcript-harness, test:probe-targets, test:eval-schemas,
      # test:doc-invocations and test:cli need bubblewrap. test:cli needs both
      # because its eval:all reconciliation cases preflight every manifest
      # suite, ci and atdd included. A shard missing either fails
      # those scripts on the missing dependency, and a new weight can move any
      # of them to any shard.
      - name: Install actionlint
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash
          echo "a96d60132afb74536ff2b55cc784d5c55b0b57980d3d49f962f0b3871447d53a  download-actionlint.bash" | sha256sum -c -
          bash download-actionlint.bash
          sudo mv ./actionlint /usr/local/bin/

      # bubblewrap is tea-atdd-red-check's linux isolation backend and is not
      # preinstalled on this runner image. Installing it as its own step makes a
      # failed install name itself before the shard starts.
      - name: Install bubblewrap (tea-atdd-red-check's linux isolation backend)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # Ubuntu 24.04+ ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks bwrap's --unshare-net from bringing up its own loopback interface
      # (RTM_NEWADDR) inside an unprivileged user namespace unless the bwrap
      # binary carries an AppArmor profile explicitly granting `userns`, and
      # this runner image's bubblewrap package ships none. Disabling the
      # restriction on this disposable, single-job runner is what every other
      # project hitting this exact failure on ubuntu-latest (Codex, Claude
      # Code's own sandboxed Bash tool, VS Code) does; it governs whether bwrap
      # can create the namespace at all, not what cli/lib/atdd-isolation.js does
      # once the namespace exists, which is everything the isolation suites
      # actually test.
      - name: Allow bubblewrap to create its own network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Runs before the shard so a plan that drops a script or a matrix that
      # skips a shard fails in seconds, in every shard, before any of them
      # spends four minutes on a partition nobody can trust.
      - name: Hold the shard plan to the npm test chain and this matrix
        run: npm run test:shards

      - name: Run this shard of the npm test chain under coverage
        run: node tools/test-shards.js --shard ${{ matrix.shard }}/5 --coverage-dir "$RUNNER_TEMP/v8" --timings "$RUNNER_TEMP/timings/shard-${{ matrix.shard }}.json"

      - name: Upload this shard's raw coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-${{ matrix.shard }}
          path: ${{ runner.temp }}/v8
          retention-days: 1
          if-no-files-found: warn

      # Merge every shard's file with `jq -S -s add shard-*.json` and commit the
      # result as tools/test-shard-weights.json to rebalance the shards.
      - name: Upload this shard's per-script timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 7
          if-no-files-found: warn

  # The supply-chain gates. lockfile-age asks the registry for every locked
  # entry's publication time, licences holds every locked licence expression to
  # the allowlist, and test:supply-chain seeds one violation per gate and watches
  # each fail. They also run in the chain shards; this job exists so a registry
  # outage or a young pin names itself in a job of its own.
  supply-chain:
    runs-on: ubuntu-latest
    # lockfile-age fetches publish metadata for every locked entry from the
    # public npm registry; bound the worst case rather than letting a stalled
    # request hold the runner until GitHub's own maximum job duration.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job runs npm ci (arbitrary install scripts), fetches JSON from
          # the npm registry, and shells out to a third-party binary; the token
          # persist-credentials would otherwise leave in .git/config has no
          # business surviving a step that is defending against exactly that
          # class of compromise.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit both lockfiles for publication age
        run: npm run test:lockfile-age

      - name: Prove the lockfile-age cache generator still reads the registry correctly
        run: npm run test:lockfile-age-cache

      - name: Hold both lockfiles to the licence allowlist
        run: npm run test:licences

      - name: Seed one violation per gate and watch it fail
        run: npm run test:supply-chain

  # dependency-direction holds cli/, tools/, test/ and src/**/*.cjs to a declared
  # layer graph and stays report-only until two eval-quality limits are fixed
  # upstream. package-boundary holds the published src/, cli/ and .claude-plugin/
  # trees against dev-only path references. field-ownership holds schemaVersion
  # to the two generators that stamp it. test:guard-publish seeds a token-present,
  # workflow-absent environment and watches the publish guard refuse it.
  layering-boundary-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report import-direction violations over cli/, tools/, test/ and src/**/*.cjs
        run: npm run test:direction

      - name: Hold the published tree to the package boundary
        run: npm run test:boundary

      - name: Hold schemaVersion to its two generators
        run: npm run test:lineage

      - name: Seed a token-present, workflow-absent environment and watch the publish guard refuse it
        run: npm run test:guard-publish

      - name: Verify each gate's script name and seed one violation per failing gate
        run: npm run test:layering-boundary-lineage

  # Coverage over the whole npm test chain, merged from the chain shards. Each
  # shard ran its scripts with NODE_V8_COVERAGE set and uploaded the raw V8
  # files that fall under the package.json c8 include roots. `c8 report` over
  # all of them applies the package.json thresholds exactly as `npm run
  # test:coverage` does locally over one serial run. Raw coverage carries
  # absolute file URLs, which match here because every job checks the
  # repository out to the same path, and `c8 report` needs that checkout for
  # `all: true` to count the files no script loaded.
  #
  # A failed shard fails this job before the report. A script that failed
  # partway recorded only part of its coverage, and a shard that timed out
  # recorded none for the scripts it never reached, so a threshold verdict
  # over that merge would measure the failure.
  coverage:
    needs: chain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail when a chain shard failed
        env:
          CHAIN_RESULT: ${{ needs.chain.result }}
        run: |
          if [ "$CHAIN_RESULT" != "success" ]; then
            echo "::error title=chain shards did not all pass::the chain job finished as $CHAIN_RESULT, so its coverage is incomplete"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job runs npm ci (arbitrary install scripts); the token
          # persist-credentials would otherwise leave in .git/config has no
          # business surviving that.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's raw coverage
        uses: actions/download-artifact@v4
        with:
          pattern: v8-*
          merge-multiple: true
          path: ${{ runner.temp }}/v8

      - name: Merge the shards' coverage and enforce the threshold
        run: npx c8 report --temp-directory "$RUNNER_TEMP/v8"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
