# Dogfoods tea-test-review on this repo's own test suite (test/*.js). Unlike
# cli/examples/pr-test-review.yml, this repo IS the skill source: it runs the CLI
# from the checkout, which reviews with the skill packaged beside it
# (skills/bmad-testarch-test-review) instead of installing a pinned npm tarball.
#
# NOT YET ENABLED: no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository
# secret exists yet, so the trigger is workflow_dispatch only, not
# pull_request, and the agent-running steps below are gated on
# `github.event_name == 'pull_request'`: under workflow_dispatch they are
# skipped. A run without either secret would just fail and post a confusing
# broken-gate comment on every real PR. The steps stay real instead of
# commented out so actionlint (test:workflows-lint) checks them, and so the
# verdict step's `steps.run-review.outcome` resolves. A skipped step's outcome is
# `skipped`, which the verdict step reports as "failed".
#
# To enable: add one of the two secrets and switch `on:` back to
# `pull_request: { types: [opened, synchronize, reopened] }`. The agent steps
# then run on their own; they need no uncommenting.
#   - ANTHROPIC_API_KEY: pay-per-token via the Anthropic Console.
#   - CLAUDE_CODE_OAUTH_TOKEN: a long-lived token from an existing Claude
#     subscription, generated locally with `claude setup-token`. No separate
#     API billing. Already supported by cli/lib/run-agent.js's env allowlist.
#
# Honest limitation: forks receive no secrets, so the review skips for fork
# PRs (the fork guard below) rather than failing. A skipped required check
# still satisfies branch protection, so this cannot be the sole gate against
# untrusted external contributions; see cli/examples/pr-test-review.yml's
# header comment for the same caveat.
name: TEA Test Review

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  review:
    name: Headless test review
    runs-on: ubuntu-latest
    # Self-adapting fork guard: on workflow_dispatch there's no pull_request
    # context to check, so this is trivially true; on pull_request it skips
    # forks (no secrets there). No change needed when switching triggers back.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Checkout (full history for the PR diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install the pinned agent CLI
        if: github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_VERSION: 2.1.220
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run headless test review
        id: run-review
        if: github.event_name == 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # A secret the repository lacks expands to an empty string, and the agent runner passes a set variable through as it is,
        # so the empty one is unset: an empty ANTHROPIC_API_KEY beside a real OAuth token would reach the agent as a key.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          node cli/test-review.js --github --pr "$PR_NUMBER" --agent claude --test-dir test --artifact-name tea-test-review --output test-review.md --json test-review.json

      - name: Upload review artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tea-test-review
          path: |
            test-review.md
            test-review.json

      - name: Export the verdict as a job output
        id: verdict
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.run-review.outcome }}
        run: |
          verdict="failed"
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            verdict="passed"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
