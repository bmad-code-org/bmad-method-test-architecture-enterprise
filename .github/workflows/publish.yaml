name: Publish

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
      bump:
        description: "Version bump type (latest channel only)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.channel || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: github.repository == 'bmad-code-org/bmad-method-test-architecture-enterprise' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure trusted publishing toolchain
        run: |
          # npm trusted publishing requires modern npm on the runner; the version floats so npm ci reads the lockfile the repo's own npm wrote.
          npm install --global npm@latest

      - name: Configure git user
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      # This job runs the full npm test chain, the same chain quality.yaml's
      # chain shards split, test:cli included, and inherits whatever system
      # dependencies that chain has accumulated: this job must stay in step
      # with quality.yaml on system dependencies, or it fails at "Run tests"
      # on every push, the way it did from roughly 16:40 UTC today onward.
      # test:doc-invocations executes documented commands that need
      # actionlint on PATH (test:eval-ci-data's lint half; test:workflows-lint
      # also lints this repository's own workflows with it) and a working
      # bubblewrap isolation backend (the atdd preflight path, and
      # tea-evaluate's file-system confinement, which every test:evaluate-*
      # suite that runs preflight or run needs) and strace (the observer of
      # that confinement's audit under bubblewrap, Story 1.60), and none of
      # them was installed here.
      #
      # tools/install-actionlint.sh installs actionlint, the same installer
      # quality.yaml's Install actionlint step runs. The version floats to
      # latest, for the reason that step's comment gives: the installer resolves
      # the latest release tag, and test/eval-ci.js's own pre-flight enforces
      # the minimum version its flags were written against. The download script
      # is pinned by commit and checksummed before it runs, and the installer
      # retries every download up to seven times (waits of 2, 4, 8, 16, 32 and
      # 64 seconds, inside the step's 5 minute timeout) and checks the release
      # tarball before it is unpacked.
      - name: Install actionlint
        timeout-minutes: 5
        run: |
          bash tools/install-actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          sudo mv "$RUNNER_TEMP/actionlint-bin/actionlint" /usr/local/bin/

      # The runner image names the package cache, so each new image downloads its own bubblewrap and strace once and every
      # later shard installs them from the cache with no mirror (tools/install-linux-sandbox.sh).
      - name: Name the runner image for the package cache
        id: sandbox-image
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-$(date -u +%G-%V)}" >> "$GITHUB_OUTPUT"

      - name: Restore the bubblewrap and strace packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/tea-linux-sandbox-debs
          key: linux-sandbox-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.sandbox-image.outputs.image }}

      - name: Install bubblewrap and strace (the linux isolation backend of tea-atdd-red-check and tea-evaluate, and the observer of tea-evaluate's audit)
        timeout-minutes: 11
        run: bash tools/install-linux-sandbox.sh

      # Ubuntu 24.04+ ships kernel.apparmor_restrict_unprivileged_userns=1,
      # which blocks bwrap's --unshare-net from bringing up its own loopback
      # interface inside an unprivileged user namespace unless the bwrap
      # binary carries an AppArmor profile explicitly granting `userns`, one
      # this runner image's bubblewrap package does not ship. See
      # quality.yaml's own step of the same name for the full explanation.
      - name: Allow bubblewrap to create its own network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: npm test

      - name: Derive next prerelease version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'next')
        run: |
          NEXT_VER=$(npm view bmad-method-test-architecture-enterprise@next version 2>/dev/null || echo "")
          LATEST_VER=$(npm view bmad-method-test-architecture-enterprise@latest version 2>/dev/null || echo "")

          BASE=$(node -e "
            const semver = require('semver');
            const next = process.argv[1] || null;
            const latest = process.argv[2] || null;
            if (!next && !latest) process.exit(0);
            if (!next) { console.log(latest); process.exit(0); }
            if (!latest) { console.log(next); process.exit(0); }
            const nextBase = next.replace(/-next\.\d+$/, '');
            console.log(semver.gte(latest, nextBase) ? latest : next);
          " "$NEXT_VER" "$LATEST_VER")

          if [ -n "$BASE" ]; then
            npm version "$BASE" --no-git-tag-version --allow-same-version
          fi
          npm version prerelease --preid=next --no-git-tag-version

      - name: Bump stable version
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Stamp CHANGELOG release section
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: node tools/stamp-changelog.js

      - name: Sync marketplace and bmod versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // The module record carries the version `bmad setup` compares against, as the `version` line of its [bmod] table.
          const bmodPath = 'skills/bmod-tea/bmod.toml';
          const bmodSource = fs.readFileSync(bmodPath, 'utf8');
          const bmodVersionLine = /^version = "[^"]*"$/m;
          if (!bmodVersionLine.test(bmodSource)) {
            throw new Error(`${bmodPath} has no version line`);
          }
          fs.writeFileSync(bmodPath, bmodSource.replace(bmodVersionLine, `version = "${packageJson.version}"`));

          const marketplacePath = '.claude-plugin/marketplace.json';
          const marketplace = JSON.parse(fs.readFileSync(marketplacePath, 'utf8'));
          const plugin = (marketplace.plugins || []).find((entry) => entry && entry.name === packageJson.name);

          if (!plugin) {
            throw new Error(`Marketplace entry not found for ${packageJson.name}`);
          }

          plugin.version = packageJson.version;
          fs.writeFileSync(marketplacePath, `${JSON.stringify(marketplace, null, 2)}\n`);
          NODE

      - name: Validate release metadata
        run: npm run test:release-metadata

      - name: Publish prerelease to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'next')
        run: npm publish --tag next --provenance

      - name: Commit version bump
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git add package.json package-lock.json .claude-plugin/marketplace.json skills/bmod-tea/bmod.toml CHANGELOG.md
          git commit -m "release: bump to v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"

      - name: Push version commit and tag
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: git push origin main --follow-tags

      - name: Publish stable release to npm
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: npm publish --tag latest --provenance

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'latest'
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          VERSION="${TAG#v}"
          has_release_notes() {
            awk '
              /^[[:space:]]*$/ { next }
              /^[[:space:]]*-{3,}[[:space:]]*$/ { next }
              { found = 1 }
              END { exit found ? 0 : 1 }
            ' <<< "$1"
          }
          BODY=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 ~ ("^##[[:space:]]*\\[?[[:space:]]*v?" ver "[[:space:]]*\\]?([[:space:]]*-[[:space:]].*)?$")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if ! has_release_notes "$BODY"; then
            BODY=$(awk '
              /^##[[:space:]]*\[Unreleased\]/ { found=1; next }
              /^## / {
                if (found) exit
                next
              }
              found { print }
            ' CHANGELOG.md)
            if has_release_notes "$BODY"; then
              echo "::notice::No CHANGELOG.md entry for $TAG — using [Unreleased] notes"
            fi
          fi
          if ! has_release_notes "$BODY"; then
            echo "::warning::No CHANGELOG.md entry for $TAG — falling back to auto-generated notes"
            gh release create "$TAG" --generate-notes
          else
            gh release create "$TAG" --notes-file - <<< "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
